name: C/C++ CI Ubuntu Latest
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: List DNS resolvers
      run: cat /etc/resolv.conf
    - name: Check internet access
      run: ping -c 3 google.com
    - name: install dependencies
      run: sudo apt-get install -y libreadline-dev 
    - name: make
      run: make
    - name: make check
      run: make check
