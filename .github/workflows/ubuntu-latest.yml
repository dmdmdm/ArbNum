name: C/C++ CI Ubuntu Latest
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Pin Ubuntu mirror
      run: |
          IP=$(dig @8.8.8.8 +short security.ubuntu.com | head -n1)
          echo "$IP security.ubuntu.com" | sudo tee -a /etc/hosts
          sudo apt-get update
    - name: install dependencies
      run: sudo apt-get install -y libreadline-dev 
    - name: make
      run: make
    - name: make check
      run: make check
