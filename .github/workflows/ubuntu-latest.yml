name: C/C++ CI Ubuntu Latest
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
         sudo apt-get -o Acquire::Retries=3 update
         sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libreadline-dev
    - name: make
      run: make
    - name: make check
      run: make check
