name: C/C++ CI Ubuntu Latest
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Resolve and pin Ubuntu mirror via DNS-over-HTTPS
      run: |
          IP=$(curl -s -H 'accept: application/dns-json' \
            'https://dns.google/resolve?name=security.ubuntu.com&type=A' \
            | jq -r '.Answer[] | select(.type==1) | .data' | head -n1)
          echo "Resolved: $IP"
          test -n "$IP" && echo "$IP security.ubuntu.com" | sudo tee -a /etc/hosts
          sudo apt-get -o Acquire::Retries=3 update
    - name: install dependencies
      run: sudo apt-get install -y libreadline-dev 
    - name: make
      run: make
    - name: make check
      run: make check
