name: C/C++ CI Ubuntu Latest
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Compare DNS resolvers
      run: |
          sudo apt-get install -y dnsutils >/dev/null 2>&1
          echo "--- via systemd stub"
          dig +short security.ubuntu.com || true
          echo "--- via 8.8.8.8"
          dig @8.8.8.8 +short security.ubuntu.com || true
          echo "--- via Azure resolver"
          dig @168.63.129.16 +short security.ubuntu.com || true
    - name: install dependencies
      run: sudo apt-get install -y libreadline-dev 
    - name: make
      run: make
    - name: make check
      run: make check
