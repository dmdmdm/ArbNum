name: C/C++ CI Ubuntu Latest
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: DNS and HTTP diagnostics
      run: |
          cat /etc/resolv.conf
          for h in security.ubuntu.com azure.archive.ubuntu.com google.com; do
            echo "--- $h"
            getent hosts $h || echo "DNS lookup failed for $h (exit $?)"
          done
          curl -sS -o /dev/null -w "%{http_code}\n" --max-time 20 http://security.ubuntu.com/ubuntu/ || true
          curl -sS -o /dev/null -w "%{http_code}\n" --max-time 20 https://google.com || true
    - name: install dependencies
      run: sudo apt-get install -y libreadline-dev 
    - name: make
      run: make
    - name: make check
      run: make check
